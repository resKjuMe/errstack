name: CI

on:
  pull_request:
  push:
    branches: [main]

# Ein zweiter Push auf denselben Branch löst den vorherigen Lauf ab.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format-php:
    name: Format PHP (Pint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/php-setup
      - name: composer lint
        run: composer lint

  static-analysis:
    name: Statische Analyse (PHPStan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/php-setup
      - name: composer analyse
        run: composer analyse

  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/php-setup
        with:
          php-version: ${{ matrix.php }}

      - name: Anwendung vorbereiten
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Migrationen
        run: php artisan migrate --force

      - name: composer test
        run: composer test

  frontend:
    name: Frontend (Format & Build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: npm run format:check
        run: npm run format:check

      - name: npm run build
        run: npm run build

  audit:
    name: Abhängigkeits-Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/php-setup
        with:
          install: 'false'

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: composer audit
        run: composer audit --locked --no-interaction

      - name: npm audit
        run: npm audit --audit-level=high

  ci:
    name: CI erfolgreich
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [format-php, static-analysis, tests, frontend, audit]
    steps:
      - name: Ergebnisse auswerten
        run: |
          echo "format-php:      ${{ needs.format-php.result }}"
          echo "static-analysis: ${{ needs.static-analysis.result }}"
          echo "tests:           ${{ needs.tests.result }}"
          echo "frontend:        ${{ needs.frontend.result }}"
          echo "audit:           ${{ needs.audit.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::Mindestens eine Prüfung ist nicht grün."
            exit 1
          fi
